# .gitea/workflows/ci-tests.yml
name: CI Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Test

    runs-on: dotnet-10.0

    defaults:
      run:
        shell: pwsh

    strategy:
      matrix:
        framework: [net10.0]

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Test
        run: >
          dotnet test Remote.Linq.slnx -f ${{ matrix.framework }} `
            /bl:msbuild.${{ matrix.framework }}.binlog `
            --results-directory TestResults `
            --coverlet `
            --coverlet-output-format json `
            --coverlet-output-format cobertura `
            --coverlet-exclude-assemblies-without-sources MissingAll `
            --coverlet-exclude-by-attribute Obsolete `
            --coverlet-exclude-by-attribute GeneratedCode `
            --coverlet-exclude-by-attribute DebuggerNonUserCode `
            --coverlet-exclude-by-attribute CompilerGenerated `
            -- --report-trx

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: msbuild_logs_${{ matrix.framework }}
          path: msbuild.*.binlog
          if-no-files-found: error

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test_results_${{ matrix.framework }}
          path: TestResults/*
