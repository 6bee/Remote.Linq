name: Publish

on:
  push:
    tags:
      - v*

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Extract version from tag
        uses: nowsprinting/check-version-format-action@v4
        id: version
        with:
          prefix: 'v'

      - name: Invalid version tag
        if: steps.version.outputs.is_valid != 'true'
        run: |
          echo "Version tag format invalid: ${{ steps.version.outputs.full }}"
          exit 1

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Mandatory to use exact version from tag action

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Check version
        # assert version match with project version so only pre-release label can be changed based on release tag
        run: dotnet build Remote.Linq.slnx --no-restore -t:CheckVersion -c Release -p BuildVersion="${{ steps.version.outputs.major_without_prefix }}.${{ steps.version.outputs.minor }}.${{ steps.version.outputs.patch }}"

      - name: Set version info
        run: |
          $VersionPrefix="${{ steps.version.outputs.major_without_prefix }}.${{ steps.version.outputs.minor }}.${{ steps.version.outputs.patch }}"
          $VersionSuffix="${{ steps.version.outputs.prerelease }}"
          $IsStable="${{ steps.version.outputs.is_stable }}"
          if ( -not $VersionSuffix ) {
            $Version=$VersionPrefix
          } else {
            $Version="$VersionPrefix-$VersionSuffix"
          }
          echo "VersionPrefix=$VersionPrefix" >> $Env:GITHUB_ENV
          echo "VersionSuffix=$VersionSuffix" >> $Env:GITHUB_ENV
          echo "Version=$Version" >> $Env:GITHUB_ENV
          echo "IsStable=$IsStable" >> $Env:GITHUB_ENV
          echo "Create release: v$Version"

      - name: Restore
        run: dotnet restore Remote.Linq.slnx --locked-mode

      - name: Build
        run: dotnet build Remote.Linq.slnx --no-restore -c Release /bl:build.binlog

      - name: Test
        #env:
        #  VSTEST_CONNECTION_TIMEOUT: 1200 # timeout 20 minutes
        run: dotnet test Remote.Linq.slnx --no-build -c Release

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: msbuild_log
          path: msbuild.binlog
          if-no-files-found: error

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget_packages
          path: artifacts
          if-no-files-found: error

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: NuGet push
        run: |
          dotnet nuget push artifacts\*.nupkg -k ${{ secrets.MYGET_AUTH_TOKEN }}          -s https://www.myget.org/F/aqua/api/v3/index.json
          dotnet nuget push artifacts\*.nupkg -k ${{ steps.login.outputs.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json
