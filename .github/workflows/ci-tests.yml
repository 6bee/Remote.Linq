name: CI Tests

on:
  push:
    branches:
      - '**'
      - '!experimental*'
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Remote.Linq.slnx --locked-mode /bl:msbuild.restore.binlog

      - name: Build
        run: dotnet build Remote.Linq.slnx --no-restore /bl:msbuild.build.binlog

      - name: Test
        run: >
          dotnet test Remote.Linq.slnx --no-build /bl:msbuild.test.binlog `
            --results-directory TestResults `
            --coverlet `
            --coverlet-output-format json `
            --coverlet-output-format cobertura `
            --coverlet-exclude-assemblies-without-sources MissingAll `
            --coverlet-exclude-by-attribute Obsolete `
            --coverlet-exclude-by-attribute GeneratedCode `
            --coverlet-exclude-by-attribute DebuggerNonUserCode `
            --coverlet-exclude-by-attribute CompilerGenerated `
            -- --report-trx

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msbuild_logs
          path: msbuild.*.binlog
          if-no-files-found: error

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test_results
          path: TestResults/*

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: TestResults/coverage.cobertura.*.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true

      - name: Build samples
        run: dotnet build Remote.Linq.Samples.sln
